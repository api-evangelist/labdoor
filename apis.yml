aid: labdoor
name: LabDoor
description: Labdoor is an independent San Francisco-based supplement testing company that buys top-selling
  vitamins, supplements, protein powders and energy drinks off retail shelves and online stores and sends
  samples to FDA-registered analytical laboratories for chemical analysis of active ingredients and potential
  contaminants. It grades every product on Label Accuracy, Product Purity, Nutritional Value, Ingredient
  Safety and Projected Efficacy, then publishes the resulting rankings, scores and expert reports for
  free so consumers can compare products, and it funds that testing through retail sales and through
  Labdoor Enterprise certification and custom-testing services sold to manufacturers. Labdoor publishes
  no public developer API, SDKs, developer portal or API documentation as of July 2026.
